name: Terraform Deployment

# Manual only: environments are kept torn down by default, so merges to main
# must not auto-apply (that would recreate the dev cluster and incur cost).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - dev
          - stage
          - prod
      resource:
        description: 'Resource to deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - network
          - kubernetes
          - argocd

# Serialize every state-changing run (deploy and destroy share this group)
concurrency:
  group: terraform-state
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: '1.14.0'
  TERRAGRUNT_VERSION: '0.93.11'
  TARGET_ENV: ${{ inputs.environment || 'dev' }}

jobs:
  deploy:
    name: Deploy ${{ inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    # GitHub Environment gate: configure required reviewers (and a `main`-only
    # deployment branch rule for prod) in Settings → Environments.
    environment: ${{ inputs.environment || 'dev' }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check Branch Constraints
        run: |
          TARGET_ENV="${{ env.TARGET_ENV }}"
          BRANCH="${{ github.ref_name }}"
          
          echo "Target Environment: $TARGET_ENV"
          echo "Current Branch: $BRANCH"
          
          if [ "$TARGET_ENV" == "prod" ] && [ "$BRANCH" != "main" ]; then
            echo "❌ Error: Production can only be deployed from 'main' branch."
            exit 1
          fi
          
          echo "✅ Branch check passed."

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Setup Terragrunt
        uses: autero1/action-terragrunt@aefb0a43c4f5503a91fefb307745c4d51c26ed0e # v3.0.2
        with:
          terragrunt-version: ${{ env.TERRAGRUNT_VERSION }}

      - name: Install Doppler
        uses: dopplerhq/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4.0.1
          
      - name: Deploy Infrastructure
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          TF_CLI_ARGS_apply: -lock-timeout=5m
          TG_NON_INTERACTIVE: "true"
          RESOURCE: ${{ inputs.resource || 'all' }}
        run: |
          echo "🚀 Deploying to $TARGET_ENV..."
          
          echo "Target Resource: $RESOURCE"
          
          if [ "$RESOURCE" == "all" ]; then
            cd infra/terraform/live/${TARGET_ENV}
            # Note: terragrunt run --all handles auto-approval automatically in non-interactive mode.
            # Adding -auto-approve explicitly causes a "flag provided but not defined" error.
            CMD="run --all apply"
          else
             # Check if directory exists
            if [ ! -d "infra/terraform/live/${TARGET_ENV}/${RESOURCE}" ]; then
              echo "❌ Error: Resource directory 'infra/terraform/live/${TARGET_ENV}/${RESOURCE}' does not exist."
              exit 1
            fi
            cd infra/terraform/live/${TARGET_ENV}/${RESOURCE}
            CMD="apply -auto-approve"
          fi
          
          echo "Executing: terragrunt $CMD"

          doppler run -- \
            terragrunt $CMD
