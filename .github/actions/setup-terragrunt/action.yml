# Composite action to set up the complete Terragrunt environment
# Installs: Terraform, Terragrunt, and Doppler CLI (for secrets management)
name: 'Setup Terragrunt Environment'
description: 'Install Terraform, Terragrunt, and Doppler CLI'

inputs:
  terraform-version:
    description: 'Terraform version'
    required: false
    default: '1.14.0'
  terragrunt-version:
    description: 'Terragrunt version'
    required: false
    default: '0.93.11'

runs:
  using: 'composite'
  steps:
    # Install Terraform using official HashiCorp action
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ inputs.terraform-version }}
        terraform_wrapper: false  # Disable wrapper to get raw terraform output

    # Install Terragrunt via a SHA-pinned action (no unverified binary download)
    - name: Setup Terragrunt
      uses: autero1/action-terragrunt@aefb0a43c4f5503a91fefb307745c4d51c26ed0e # v3.0.2
      with:
        terragrunt-version: ${{ inputs.terragrunt-version }}

    # Install Doppler CLI via the official, SHA-pinned action (no `curl | sudo sh`)
    - name: Install Doppler CLI
      uses: dopplerhq/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4.0.1
